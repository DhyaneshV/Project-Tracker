## ── Project Allocation Requests ──────────────────────────────────────────────

enum AllocationStatus {
  PENDING
  APPROVED
  REJECTED
}

type AllocationRequest {
  id: ID!
  projectId: ID!
  projectName: String!
  requestedBy: ID!
  requestedByName: String!
  requestedUserId: ID!
  requestedUserName: String!
  requestedUserRole: FunctionalRole
  specialty: MemberSpecialty!
  allocation: Int!
  projectRole: ProjectRole!
  reason: String
  status: AllocationStatus!
  approvedBy: ID
  approvedByName: String
  rejectionReason: String
  createdAt: DateTime!
  resolvedAt: DateTime
}

type Query {
  me: User
  
  getAllUsers(
    roleFilter: [FunctionalRole]
    statusFilter: [UserStatus]
    twoFactorFilter: Boolean
  ): [User!]!
  
  getAuditLogs(limit: Int, cursor: String): AuditLogPage!
  
  # FEATURE 2: TEAM INVITATIONS (TL ONLY)
  projectTeamMembers(projectId: ID!): [ProjectMember!]!
  availableEmployeesForProject(projectId: ID!, search: String): [User!]!

  # Users & HR
  getMyTeamMembers: [User!]!
  getDepartmentEmployees(department: Department): [User!]!
  getEmployeeById(userId: ID!): User
  getSalaryData(userId: ID!): SalaryData

  # Projects
  getProjects(status: ProjectStatus): [Project!]!
  getProject(id: ID!): Project
  getProjectTasks(projectId: ID!, status: TaskStatus): [ProjectTask!]!
  getProjectUpdates(projectId: ID!): [ProjectUpdate!]!
  getProjectAnalytics(projectId: ID!): ProjectAnalytics!
  getSRSDocuments(projectId: ID!): [SRSDocument!]!
  listProjectDocuments(projectId: ID!, type: DocumentType): [ProjectDocument!]!

  # Executive Dashboard (C_SUITE / SVP / VP only)
  getOrgAnalytics: OrgAnalytics!
  getOrgRiskAlerts: [RiskAlert!]!
  getBudgetOverview: [BudgetSummary!]!

  # Internal Messaging
  getConversations: [Conversation!]!
  getDirectMessages(recipientId: ID!, limit: Int, before: DateTime): [DirectMessage!]!
  getUnreadCount: Int!

  # Personal & Cross-Project Views
  getMyTasks: [ProjectTask!]!
  getActivityFeed(limit: Int): [ActivityEvent!]!
  getUpcomingDeadlines: [DeadlineItem!]!

  # Allocation Requests
  getPendingAllocations: [AllocationRequest!]!
  getProjectAllocations(projectId: ID!): [AllocationRequest!]!

  # Notifications
  getMyNotifications(limit: Int): [Notification!]!
  getUnreadNotificationCount: Int!
  getNotificationPreferences: NotificationPreferences!

  # Payroll
  getSalaryStructure(userId: ID!): SalaryStructure
  getAllSalaryStructures: [SalaryStructure!]!
  getPayrollRun(runId: ID!): PayrollRun
  getPayrollHistory: [PayrollRun!]!
  getPayslip(userId: ID!, month: String!): Payslip
  getMyPayslips: [Payslip!]!
}

type Mutation {
  signup(email: String!, fullName: String!, password: String!, organizationName: String): AuthPayload!
  login(email: String!, password: String!): LoginStep1Payload!
  verifyLoginOTP(email: String!, otp: String!): AuthPayload!
  changePassword(newPassword: String!): Boolean!
  requestPasswordReset(email: String!): Boolean!
  resetPassword(token: String!, newPassword: String!): Boolean!
  
  # MANAGER-ONLY MUTATIONS
  inviteUser(
    email: String!, 
    fullName: String!, 
    category: UserCategory!, 
    role: FunctionalRole!, 
    department: Department!,
    specialty: MemberSpecialty,
    assignedProjectIds: [ID!],
    managedTeamIds: [ID!],
    reportingManagerId: ID,
    organizationId: ID,
    twoFactorRequired: Boolean
  ): InviteUserPayload!
  resendInvitation(userId: ID!): Boolean!
  dropUser(userId: ID!, otp: String!): DropUserPayload!
  updateUserStatus(userId: ID!, status: UserStatus!): User!
  updateUserOrgRole(userId: ID!, orgRole: OrgRole!, role: FunctionalRole): User!
  updateUserRole(userId: ID!, newRole: FunctionalRole!): User!
  promoteUser(userId: ID!, newRole: FunctionalRole, newLevel: Int): User!
  suspendUser(userId: ID!, reason: String!): User!
  changeReportingManager(userId: ID!, newManagerId: ID!): User!
  requestSecurityOTP: Boolean!

  # MANAGER/C_SUITE ONLY - Member management
  addMemberToProject(projectId: ID!, userId: ID!, projectRole: ProjectRole!, specialty: MemberSpecialty!, allocation: Int!, startDate: DateTime!): ProjectMember!
  removeTeamMemberFromProject(projectId: ID!, userId: ID!): Boolean!
  
  # Projects & Tasks
  createProject(name: String!, description: String!, category: ProjectCategory!, startDate: DateTime!, targetEndDate: DateTime!, releaseDate: DateTime, estimatedDays: Int, maxTeamSize: Int!, projectLeadId: ID, viceTeamLeaderId: ID, budgetUSD: Float, specialtiesNeeded: [MemberSpecialty!]): Project!
  updateProjectDetails(projectId: ID!, name: String, description: String, status: ProjectStatus, targetEndDate: DateTime, budgetUSD: Float): Project!
  updateProjectProgress(projectId: ID!, completionPercentage: Float!, status: ProjectStatus): Project!
  addProjectUpdate(projectId: ID!, type: UpdateType!, title: String!, description: String, severity: Severity!): ProjectUpdate!
  createTask(projectId: ID!, title: String!, priority: TaskPriority!, specialty: MemberSpecialty, assignedToId: ID, dependsOn: [ID!]): ProjectTask!
  updateTaskStatus(taskId: ID!, status: TaskStatus!, blockerReason: String, completionNote: String): ProjectTask!
  addTaskAttachment(taskId: ID!, fileKey: String!, fileName: String!, mimeType: String!, fileSize: Int!): ProjectTask!
  removeTaskAttachment(taskId: ID!, fileKey: String!): ProjectTask!
  uploadSRSDocument(projectId: ID!, url: String!, version: Int!): SRSDocument!
  confirmProjectDoc(projectId: ID!, docId: ID!, fileKey: String!, title: String!, description: String, type: DocumentType!, tags: [String!], fileName: String!, mimeType: String!, fileSize: Int!, version: Int): ProjectDocument!
  deleteProjectDoc(projectId: ID!, docId: ID!): Boolean!
  
  # Internal Messaging
  sendDirectMessage(recipientId: ID!, subject: String!, content: String!, priority: MessagePriority, parentMessageId: ID): DirectMessage!
  markMessagesRead(senderId: ID!): Boolean!

  # Allocation Requests (Project Lead requests → Manager approves)
  createAllocationRequest(projectId: ID!, requestedUserId: ID!, specialty: MemberSpecialty!, allocation: Int!, projectRole: ProjectRole!, reason: String): AllocationRequest!
  approveAllocation(requestId: ID!): AllocationRequest!
  rejectAllocation(requestId: ID!, reason: String!): AllocationRequest!

  enable2FA(method: TwoFactorMethod!): TwoFactorSetupPayload!
  verify2FASetup(method: TwoFactorMethod!, code: String!): Boolean!
  adminUpdate2FA(userId: ID!, enabled: Boolean!, method: TwoFactorMethod): User!
  logout: Boolean!

  # Notifications
  markNotificationRead(notificationId: ID!, createdAt: DateTime!): Boolean!
  updateNotificationPreferences(preferences: NotificationPreferencesInput!): NotificationPreferences!
  markAllNotificationsRead: Boolean!

  # Payroll (C_SUITE / HR only)
  setSalaryStructure(userId: ID!, basicPay: Float!, hraPercentage: Float, conveyanceAllowance: Float, medicalAllowance: Float, specialAllowance: Float, pfEnabled: Boolean, esiEnabled: Boolean, ptEnabled: Boolean, tdsPercentage: Float): SalaryStructure!
  runPayroll(month: String!, totalWorkingDays: Int!): PayrollRun!
  approvePayroll(runId: ID!): PayrollRun!
}

type AuthPayload {
  user: User!
  token: String!
  isNewUser: Boolean!
  requiredActions: [String!]
}

type LoginStep1Payload {
  requiresOTP: Boolean!
  otpExpiry: DateTime!
  message: String!
}

type DropUserPayload {
  success: Boolean!
  auditId: ID
}

type TwoFactorSetupPayload {
  method: TwoFactorMethod!
  qrCodeSVG: String
  secret: String
  instructions: String
}

